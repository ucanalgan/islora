[package]
name = "island-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "islora"
path = "src/main.rs"

[dependencies]
island-core = { path = "../island-core" }
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel_AppService",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_DirectX",
